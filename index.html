<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .dark
        {
            background-color: black;
            color: aliceblue;
        }
    </style>
</head>
<body>
    <button onClick="toggle()">
        Click
    </button>
</body>
<script>
    if(localStorage.getItem("theme")==="dark")
    {
        toggle(); 
    }
    function toggle()
    {
            //ele.classList.toggle("dark"); 
            document.getElementsByTagName("body")[0].classList.toggle("dark"); 
            document.getElementsByTagName("body")[0].classList.contains("dark")?localStorage.setItem("theme","dark"):localStorage.setItem("theme","white");
            
    }
</script>
</html>
